name: ci
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      platforms:
        description: Comma-separated native targets, or all
        default: all

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/compute-texture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      musl-runners: ${{ steps.targets.outputs.musl-runners }}
      has-musl: ${{ steps.targets.outputs.has-musl }}
      linux-runners: ${{ steps.targets.outputs.linux-runners }}
      desktop-platforms: ${{ steps.targets.outputs.desktop-platforms }}
      has-linux: ${{ steps.targets.outputs.has-linux }}
      has-desktop: ${{ steps.targets.outputs.has-desktop }}
    steps:
      - uses: actions/checkout@v4
      - run: npm run test:release
      - id: targets
        env:
          PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, os
          targets = [
              {"target": "linux-x64", "runner": "ubuntu-24.04", "container": "quay.io/pypa/manylinux_2_28_x86_64"},
              {"target": "linux-arm64", "runner": "ubuntu-24.04-arm", "container": "quay.io/pypa/manylinux_2_28_aarch64"},
              {"target": "linuxmusl-x64", "runner": "ubuntu-24.04"},
              {"target": "linuxmusl-arm64", "runner": "ubuntu-24.04-arm"},
              {"target": "win32-arm64", "runner": "windows-11-arm"},
              {"target": "darwin-arm64", "runner": "macos-15"},
              {"target": "darwin-x64", "runner": "macos-15-intel"},
              {"target": "win32-x64", "runner": "windows-2025"},
          ]
          wanted = os.environ["PLATFORMS"]
          if wanted != "all":
              names = set(wanted.split(","))
              assert names <= {item["target"] for item in targets}, "Unknown platform"
              targets = [item for item in targets if item["target"] in names]
          print("matrix=" + json.dumps({"include": targets}))
          linux = [item["runner"] for item in targets if item["target"].startswith("linux-")]
          musl = [item["runner"] for item in targets if item["target"].startswith("linuxmusl-")]
          print("musl-runners=" + json.dumps(musl))
          print("has-musl=" + json.dumps(bool(musl)))
          compatibility = {"darwin-arm64": "macos-14", "win32-x64": "windows-2022"}
          desktop = [{"target": item["target"], "runner": compatibility.get(item["target"], item["runner"])}
                     for item in targets if not item["target"].startswith("linux")]
          print("linux-runners=" + json.dumps(linux))
          print("desktop-platforms=" + json.dumps(desktop))
          print("has-linux=" + json.dumps(bool(linux)))
          print("has-desktop=" + json.dumps(bool(desktop)))
          PYTHON

  native:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux build tools
        if: runner.os == 'Linux' && !startsWith(matrix.target, 'linuxmusl-')
        run: |
          dnf install -y bison flex clang patchelf pkgconf-pkg-config
          echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"
          echo /opt/rh/gcc-toolset-14/root/usr/bin >> "$GITHUB_PATH"
          /opt/python/cp312-cp312/bin/pip install ninja==1.13.0 cmake==3.31.6 meson==1.7.0 mako pyyaml packaging
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      - name: Desktop build tools
        if: runner.os != 'Linux'
        run: python -m pip install ninja==1.13.0 meson==1.7.0 mako pyyaml packaging
      - name: macOS parser tools
        if: runner.os == 'macOS'
        run: |
          brew install bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
      - name: Windows parser tools
        if: runner.os == 'Windows'
        run: choco install -y winflexbison3 --no-progress
      - uses: actions/setup-node@v4
        if: ${{ !startsWith(matrix.target, 'linuxmusl-') }}
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        if: ${{ !startsWith(matrix.target, 'linuxmusl-') }}
        with:
          go-version: '1.24.2'
          cache: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.target == 'win32-arm64' && 'arm64' || 'x64' }}
      - name: Windows paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: build
          key: dawn-${{ matrix.target }}-${{ runner.os == 'Linux' && 'manylinux-' || '' }}${{ hashFiles('native/*.py', 'native/*.cpp', 'native/*.h', 'deps/*.py', 'deps/*.sh', '.github/workflows/ci.yml') }}
          restore-keys: dawn-${{ matrix.target }}-${{ runner.os == 'Linux' && 'manylinux-' || '' }}
      - name: Build and test Alpine package
        id: alpine
        if: startsWith(matrix.target, 'linuxmusl-')
        run: docker run --rm -v "$PWD:/work" -w /work node:22-alpine3.22 sh deps/alpine.sh ${{ matrix.target }}
      - name: Build native package
        if: ${{ !startsWith(matrix.target, 'linuxmusl-') }}
        run: python native/build.py build dist/${{ matrix.target }}
      - name: Build Mesa
        id: mesa
        if: ${{ !startsWith(matrix.target, 'linuxmusl-') }}
        run: python deps/mesa.py dist/${{ matrix.target }} --work build/mesa --jobs 4
      - name: Bundle Linux runtime
        if: runner.os == 'Linux' && !startsWith(matrix.target, 'linuxmusl-')
        run: python deps/bundle.py dist/${{ matrix.target }}
      - name: Package
        if: ${{ !startsWith(matrix.target, 'linuxmusl-') }}
        run: node deps/package.js dist/${{ matrix.target }}
      - name: Verify native architecture
        if: ${{ !startsWith(matrix.target, 'linuxmusl-') }}
        env:
          TARGET: ${{ matrix.target }}
        run: node --input-type=module -e 'import assert from "node:assert/strict"; import fs from "node:fs"; const target=process.env.TARGET; assert.equal(JSON.parse(fs.readFileSync("dist/"+target+"/build.json")).target,target); assert.equal(process.arch,target.split("-").at(-1));'
      - name: Audit runtime dependencies
        if: ${{ !startsWith(matrix.target, 'linuxmusl-') }}
        run: python deps/check.py dist/${{ matrix.target }}
      - name: Test installed packages
        if: ${{ !startsWith(matrix.target, 'linuxmusl-') }}
        run: npm run test:package -- dist/${{ matrix.target }}
      - name: Restore host ownership after Alpine container
        if: always() && startsWith(matrix.target, 'linuxmusl-')
        run: sudo chown -R "$(id -u):$(id -g)" .
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' && (steps.mesa.outcome == 'success' || steps.alpine.outcome == 'success') }}
        with:
          path: build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.target }}
          path: test/out
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/${{ matrix.target }}

  clean-linux:
    needs: [plan, native]
    if: ${{ !cancelled() && needs.plan.outputs.has-linux == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.linux-runners) }}
        image: [node:22-bookworm-slim, node:24-bookworm-slim, node:26-bookworm-slim, node:24-trixie-slim, registry.access.redhat.com/ubi8/nodejs-22-minimal]
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
      options: --user root
    steps:
      - name: Checkout tools on UBI
        if: contains(matrix.image, 'ubi8')
        run: microdnf install -y gzip tar
      - uses: actions/checkout@v4
      - name: Target
        run: echo "TARGET=linux-$(node -p process.arch)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: package-${{ env.TARGET }}
          path: dist/${{ env.TARGET }}
      - name: Render without system graphics packages
        run: npm run test:package -- dist/${{ env.TARGET }} --repetitions 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-${{ env.TARGET }}-${{ strategy.job-index }}
          path: test/out

  desktop-compat:
    needs: [plan, native]
    if: ${{ !cancelled() && needs.plan.outputs.has-desktop == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
        platform: ${{ fromJSON(needs.plan.outputs.desktop-platforms) }}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.platform.target }}
          path: dist/${{ matrix.platform.target }}
      - name: Test installed package on another Node version
        run: npm run test:package -- dist/${{ matrix.platform.target }} --repetitions 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-${{ matrix.node }}-${{ matrix.platform.target }}
          path: test/out

  clean-musl:
    needs: [plan, native]
    if: ${{ !cancelled() && needs.plan.outputs.has-musl == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.musl-runners) }}
        image: [node:22-alpine3.22, node:24-alpine, node:26-alpine]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Target
        run: echo "TARGET=linuxmusl-$(node -p process.arch)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: package-${{ env.TARGET }}
          path: dist/${{ env.TARGET }}
      - name: Render in clean Alpine
        run: docker run --rm --cpus 2 --memory 1g --memory-swap 1g -v "$PWD:/work" -w /work ${{ matrix.image }} npm run test:package -- dist/${{ env.TARGET }} --repetitions 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-${{ env.TARGET }}-${{ strategy.job-index }}
          path: test/out
